<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="{{ url_for('static', path='/css/base.css') }}" rel="stylesheet">
    {% block stylesheets %}{% endblock %}
</head>
<body>

    {% if show_header_nav %}
    <header class="main-page-header">
        <nav class="header-nav">
            <ul class="logo-group">
                <li>
                    <img src="{{ url_for('static', path='images/logo.png') }}" alt="Logo">
                </li>
                <li class="logo-text">
                    <h4>Cristian</h4>
                    <p>ML · AI · Data</p>
                </li>
            </ul>
    
            <ul class="header-links">
                <li><a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="{{ url_for('about_me_page') }}" class="{% if active_page == 'about' %}active{% endif %}">About</a></li>
                <li><a href="{{ url_for('projects_page') }}" class="{% if active_page == 'projects' %}active{% endif %}">Projects</a></li>
                <li><a href="{{ url_for('skills_page') }}" class="{% if active_page == 'skills' %}active{% endif %}">Skills</a></li>
            </ul>
        </nav>
    </header>
    {% endif %}

    <main class="content-wrapper">
        {% block content %}{% endblock %}
    </main>

    {% if show_credit_footer %}
    <footer class="site-credit-footer">
        <div class="footer-content">
            <p>&copy; 2025 Cristian Salazar Torrez</p>
            <div class="footer-socials">
                <a href="https://github.com/crist2201" target="_blank" class="social-icon github" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://linkedin.com/in/cristian-salazar-torrez/" target="_blank" class="social-icon linkedin" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="mailto:cristiansalazar822@gmail.com" class="social-icon google" title="Email"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>
    {% endif %}

    {% block scripts %}{% endblock %}

</body>
</html>
